services:
  api:
    build: .
    container_name: mini-order-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "mini-order-api"
      SERVICE_NAME: "ecommerce-api"
      ENVIRONMENT: "development"
      APP_VERSION: "1.0.0"
      LOG_LEVEL: "INFO"
      PAYMENT_FAILURE_RATE: "0.25"
      PAYMENT_MIN_DELAY_MS: "80"
      PAYMENT_MAX_DELAY_MS: "900"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - observability-network

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: mini-order-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - observability-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: mini-order-cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - observability-network

  loki:
    image: grafana/loki:3.3.2
    container_name: mini-order-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - observability-network

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: mini-order-alloy
    restart: unless-stopped
    ports:
      - "12345:12345"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/alloy", "--version"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - observability-network

  grafana:
    image: grafana/grafana:11.4.0
    container_name: mini-order-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - observability-network

networks:
  observability-network:
    name: observability-network
    driver: bridge

volumes:
  grafana_data:
  loki_data:
  prometheus_data:
